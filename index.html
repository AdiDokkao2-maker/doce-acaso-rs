/* ---------------------------- cloud sync (Google Sheets) ---------------------------- */

function getSyncConfig() {
  try {
    return {
      url: localStorage.getItem("doce-acaso-sync-url") || "",
      token: localStorage.getItem("doce-acaso-sync-token") || ""
    };
  } catch (e) {
    return {
      url: "",
      token: ""
    };
  }
}
function setSyncConfig(url, token) {
  try {
    localStorage.setItem("doce-acaso-sync-url", url.trim());
    localStorage.setItem("doce-acaso-sync-token", token.trim());
  } catch (e) {
    console.error(e);
  }
}
async function fetchCloudAll() {
  const {
    url,
    token
  } = getSyncConfig();
  if (!url) throw new Error("no-config");
  const sep = url.includes("?") ? "&" : "?";
  const res = await fetch(`${url}${sep}token=${encodeURIComponent(token)}&_=${Date.now()}`, {
    method: "GET",
    cache: "no-store"
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function pushCloud(payload) {
  const {
    url,
    token
  } = getSyncConfig();
  if (!url) throw new Error("no-config");
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      ...payload,
      token
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function normalizePhone(raw) {
  if (!raw) return "";
  let digits = String(raw).replace(/\D/g, "");
  if (!digits) return "";
  if (digits.length <= 11) digits = "55" + digits; // assume BR se faltar DDI
  return digits;
}
function buildWhatsappMessage(sale) {
  const PIX_KEY = "11992907213";
  const lines = sale.items.map(it => `• ${it.qty}x ${it.name} — ${money(it.subtotal)}`);
  return [`Olá ${sale.customerName}! Aqui está o resumo da sua compra na *Doce Acaso RS* 🍪`, "", ...lines, "", `*Total: ${money(sale.total)}*`, "", `💳 Chave Pix para pagamento: *${PIX_KEY}*`, "", "Obrigado pela preferência! 💗"].join("\n");
}
function sendSaleWhatsapp(sale, customer) {
  const phone = customer ? normalizePhone(customer.phone) : "";
  if (!phone) return false;
  const text = encodeURIComponent(buildWhatsappMessage(sale));
  window.open(`https://wa.me/${phone}?text=${text}`, "_blank");
  return true;
}
